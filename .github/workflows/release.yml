name: Build release APK 
on:
  push:

jobs:
  build:
    # Заменили self-hosted на стандартный сервер GitHub
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_HARDLINK: "true"
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: DamianReeves/write-file-action@master
        with:
          path: ./API_KEYS
          contents: |
            APP_ID = 6
            APP_HASH = "eb06d4abfb49dc3eeb1aeb98ae0f581e"
            MAPS_V2_API = ${{ secrets.MAPS_KEY }}
            
            SIGNING_KEY_PASSWORD = ${{ secrets.CERT_KEY }}
            SIGNING_KEY_ALIAS = ${{ secrets.CERT_KEY }}
            SIGNING_KEY_STORE_PASSWORD = ${{ secrets.CERT_KEY }}
          write-mode: overwrite

      - name: Update packages
        run: sudo apt-get update

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle Build
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches/build-cache-*
            ~/.gradle/buildOutputCleanup/cache.properties
          key: gradle-builds-${{ github.sha }}
          restore-keys: |
            gradle-builds

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache
          restore-keys: ccache

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v2

      - name: Install Build Tools
        run: sudo apt-get install bison gcc make curl ninja-build ccache -y

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleAfatRelease

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: Release APK
          path: TMessagesProj/build/outputs/apk/afat/release/*.apk
